<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EREG Audit</title>

    <style>
        :root {
            --border: #d9dde3;
            --background: #f6f7f9;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #2563eb;
            --enhet: #065f46;
            --enhet-bg: #ecfdf5;
            --underenhet: #92400e;
            --underenhet-bg: #fffbeb;
            --tombstone: #991b1b;
            --tombstone-bg: #fef2f2;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
            background: var(--background);
            color: var(--text);
        }

        body {
            min-height: 100vh;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        nav a {
            text-decoration: none;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        nav a:hover {
            background: var(--background);
        }

        nav a.active {
            background: var(--accent);
            color: white;
        }

        main {
            padding: 20px 24px 40px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }

        .search {
            flex: 1;
            min-width: 280px;
        }

        input,
        select,
        button {
            font: inherit;
        }

        input,
        select {
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            padding: 9px 11px;
            color: var(--text);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        button {
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            padding: 9px 13px;
            cursor: pointer;
        }

        button:hover {
            background: var(--background);
        }

        .stats {
            display: flex;
            gap: 18px;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .table-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: visible;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            background: #fafafa;
            border-bottom: 1px solid var(--border);
            padding: 10px 12px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        td {
            border-bottom: 1px solid var(--border);
            padding: 10px 12px;
            font-size: 13px;
            vertical-align: top;
        }

        tr.event-row:hover {
            background: #fafcff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .expand-button {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1;
        }

        .mono {
            font-family:
                    ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    monospace;
        }

        .type-badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }

        .type-enhet {
            background: var(--enhet-bg);
            color: var(--enhet);
        }

        .type-underenhet {
            background: var(--underenhet-bg);
            color: var(--underenhet);
        }

        .type-tombstone {
            background: var(--tombstone-bg);
            color: var(--tombstone);
        }

        .json-row td {
            padding: 0;
            background: #111827;
        }

        .json-container {
            padding: 14px 16px;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e5e7eb;
            font-family:
                    ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .status {
            padding: 14px;
            color: var(--muted);
            font-size: 14px;
        }

        .error {
            padding: 14px;
            color: var(--tombstone);
            background: var(--tombstone-bg);
            border: 1px solid #fecaca;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .sort-indicator {
            color: var(--accent);
            margin-left: 4px;
        }

        @media (max-width: 900px) {
            main {
                padding: 12px;
            }

            header {
                padding: 12px;
            }

            .header-row {
                align-items: flex-start;
                flex-direction: column;
            }

            th:nth-child(4),
            td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-row">
        <div>
            <h1>EREG Audit</h1>
            <div class="subtitle" id="subtitle">Kafka cache inspection</div>
        </div>

        <nav>
            <a id="nav-rows" href="/internal/gui/?view=rows">
                Kafka rows
            </a>

            <a id="nav-registration"
               href="/internal/gui/?view=registreringsdato">
                Registreringsdato
            </a>
        </nav>
    </div>
</header>

<main>

    <div id="error-container"></div>

    <div class="toolbar">
        <input
                id="search"
                class="search"
                type="search"
                placeholder="Search org number, name, offset, JSON..."
        >

        <select id="type-filter">
            <option value="">All types</option>
            <option value="ENHET">ENHET</option>
            <option value="UNDERENHET">UNDERENHET</option>
        </select>

        <button id="reload">Reload</button>
    </div>

    <div class="stats">
        <span>Loaded: <strong id="total-count">0</strong></span>
        <span>Visible: <strong id="visible-count">0</strong></span>
        <span>Expanded: <strong id="expanded-count">0</strong></span>
    </div>

    <div class="table-container">

        <div id="loading" class="status">
            Loading events...
        </div>

        <table id="events-table" style="display: none;">
            <thead>
            <tr>
                <th style="width: 45px;"></th>
                <th id="sort-column-1">Offset</th>
                <th>Partition</th>
                <th>Type</th>
                <th>Org number</th>
                <th>Name</th>
                <th id="sort-column-7">
                    Registration date
                </th>
            </tr>
            </thead>

            <tbody id="events-body"></tbody>
        </table>

        <div id="empty" class="empty" style="display: none;">
            No events match the current filter.
        </div>

    </div>

</main>

<script>
    const API_URL = "/internal/gui/api/events";

    let events = [];
    const expanded = new Set();

    const searchInput = document.getElementById("search");
    const typeFilter = document.getElementById("type-filter");
    const reloadButton = document.getElementById("reload");

    const loading = document.getElementById("loading");
    const table = document.getElementById("events-table");
    const body = document.getElementById("events-body");
    const empty = document.getElementById("empty");

    const totalCount = document.getElementById("total-count");
    const visibleCount = document.getElementById("visible-count");
    const expandedCount = document.getElementById("expanded-count");
    const errorContainer = document.getElementById("error-container");

    const subtitle = document.getElementById("subtitle");
    const navRows = document.getElementById("nav-rows");
    const navRegistration = document.getElementById("nav-registration");

    function getView() {
        const params = new URLSearchParams(window.location.search);
        const view = params.get("view");

        return view === "registreringsdato"
            ? "registreringsdato"
            : "rows";
    }

    const currentView = getView();

    function configureView() {
        if (currentView === "registreringsdato") {
            navRegistration.classList.add("active");
            navRows.classList.remove("active");

            subtitle.textContent =
                "Events sorted by registreringsdatoEnhetsregisteret";

        } else {
            navRows.classList.add("active");
            navRegistration.classList.remove("active");

            subtitle.textContent =
                "Events sorted by Kafka offset";
        }
    }

    function escapeHtml(value) {
        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function parseJson(json) {
        if (!json) {
            return null;
        }

        if (typeof json === "object") {
            return json;
        }

        try {
            return JSON.parse(json);
        } catch (error) {
            return null;
        }
    }

    function prettyJson(json) {
        const parsed = parseJson(json);

        if (parsed !== null) {
            return JSON.stringify(parsed, null, 2);
        }

        return json || "";
    }

    function getName(event) {
        const parsed = parseJson(event.json);
        return parsed?.navn || "";
    }

    function getRegistrationDate(event) {
        const parsed = parseJson(event.json);
        return parsed?.registreringsdatoEnhetsregisteret || "";
    }

    function eventTypeClass(event) {
        if (event.isTombstone) {
            return "type-tombstone";
        }

        if (event.orgType === "ENHET") {
            return "type-enhet";
        }

        if (event.orgType === "UNDERENHET") {
            return "type-underenhet";
        }

        return "";
    }

    function eventTypeLabel(event) {
        if (event.isTombstone) {
            return "TOMBSTONE";
        }

        return event.orgType || "";
    }

    function makeEventId(event, index) {
        return `${event.partition ?? "?"}:${event.offset ?? index}`;
    }

    function filteredEvents() {
        const search = searchInput.value.trim().toLowerCase();
        const type = typeFilter.value;

        return events
            .filter((event) => {

                if (type && event.orgType !== type) {
                    return false;
                }

                if (!search) {
                    return true;
                }

                const haystack = [
                    event.offset,
                    event.partition,
                    event.orgNumber,
                    event.orgType,
                    event.isTombstone,
                    getName(event),
                    getRegistrationDate(event),
                    event.json
                ]
                    .join(" ")
                    .toLowerCase();

                return haystack.includes(search);
            })
            .sort((a, b) => {

                if (currentView === "registreringsdato") {
                    const dateA = getRegistrationDate(a) || "9999-12-31";
                    const dateB = getRegistrationDate(b) || "9999-12-31";

                    const dateCompare = dateA.localeCompare(dateB);

                    if (dateCompare !== 0) {
                        return dateCompare;
                    }

                    return Number(a.offset ?? 0)
                        - Number(b.offset ?? 0);
                }

                return Number(a.offset ?? 0)
                    - Number(b.offset ?? 0);
            });
    }

    function updateSortHeader() {
        const offsetHeader = document.getElementById("sort-column-1");
        const registrationHeader = document.getElementById("sort-column-7");

        if (currentView === "registreringsdato") {
            offsetHeader.innerHTML = "Offset";
            registrationHeader.innerHTML =
                'Registration date <span class="sort-indicator">↑</span>';
        } else {
            offsetHeader.innerHTML =
                'Offset <span class="sort-indicator">↑</span>';
            registrationHeader.innerHTML =
                "Registration date";
        }
    }

    function render() {
        const filtered = filteredEvents();

        totalCount.textContent = events.length.toLocaleString();
        visibleCount.textContent = filtered.length.toLocaleString();
        expandedCount.textContent = expanded.size.toLocaleString();

        body.innerHTML = "";

        if (filtered.length === 0) {
            table.style.display = "none";
            empty.style.display = "block";
            return;
        }

        empty.style.display = "none";
        table.style.display = "table";

        filtered.forEach((event, index) => {

            const id = makeEventId(event, index);
            const isExpanded = expanded.has(id);

            const row = document.createElement("tr");
            row.className = "event-row";

            row.innerHTML = `
                <td>
                    <button
                        class="expand-button"
                        title="${isExpanded ? "Collapse" : "Expand"}"
                        data-id="${escapeHtml(id)}"
                    >
                        ${isExpanded ? "−" : "+"}
                    </button>
                </td>

                <td class="mono">
                    ${escapeHtml(event.offset)}
                </td>

                <td class="mono">
                    ${escapeHtml(event.partition)}
                </td>

                <td>
                    <span class="type-badge ${eventTypeClass(event)}">
                        ${escapeHtml(eventTypeLabel(event))}
                    </span>
                </td>

                <td class="mono">
                    ${escapeHtml(event.orgNumber)}
                </td>

                <td>
                    ${escapeHtml(getName(event))}
                </td>

                <td class="mono">
                    ${escapeHtml(getRegistrationDate(event))}
                </td>
            `;

            body.appendChild(row);

            if (isExpanded) {
                const jsonRow = document.createElement("tr");
                jsonRow.className = "json-row";

                jsonRow.innerHTML = `
                    <td colspan="7">
                        <div class="json-container">
                            <pre>${escapeHtml(prettyJson(event.json))}</pre>
                        </div>
                    </td>
                `;

                body.appendChild(jsonRow);
            }
        });

        body.querySelectorAll(".expand-button").forEach(button => {
            button.addEventListener("click", () => {

                const id = button.dataset.id;

                if (expanded.has(id)) {
                    expanded.delete(id);
                } else {
                    expanded.add(id);
                }

                render();
            });
        });
    }

    async function loadEvents() {

        errorContainer.innerHTML = "";

        loading.style.display = "block";
        table.style.display = "none";
        empty.style.display = "none";

        try {

            const response = await fetch(API_URL, {
                headers: {
                    "Accept": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status} ${response.statusText}`
                );
            }

            const result = await response.json();

            if (Array.isArray(result)) {
                events = result;
            } else if (Array.isArray(result.events)) {
                events = result.events;
            } else {
                throw new Error(
                    "Unexpected API response. " +
                    "Expected an array or { events: [] }."
                );
            }

            loading.style.display = "none";

            render();

        } catch (error) {

            loading.style.display = "none";

            errorContainer.innerHTML = `
                <div class="error">
                    <strong>Could not load events.</strong><br>
                    ${escapeHtml(error.message)}
                    <br><br>
                    Expected endpoint:
                    <span class="mono">
                        ${escapeHtml(API_URL)}
                    </span>
                </div>
            `;
        }
    }

    searchInput.addEventListener("input", render);
    typeFilter.addEventListener("change", render);
    reloadButton.addEventListener("click", loadEvents);

    configureView();
    updateSortHeader();
    loadEvents();
</script>

</body>
</html>
